name: Build Fire TV APK

on:
  push:
    paths: ['firetv/**', '.github/workflows/firetv-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set).
      - name: Build
        run: gradle -p firetv assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RainDash-FireTV
          path: firetv/app/build/outputs/apk/release/*.apk
