<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html { font-size: calc(100vw / 96); }
  body { margin: 0; background: #000; color: #fff; font-family: "Trebuchet MS", Roboto, sans-serif; height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; }
  .rain { position: fixed; inset: 0; opacity: .25;
    background-image: repeating-linear-gradient(100deg, transparent 0 46px, rgba(150,160,190,.35) 46px 47px, transparent 47px 120px);
    background-size: 100% 300px; animation: rain 1.4s linear infinite; }
  @keyframes rain { to { background-position: -50px 300px; } }
  h1 { font-size: 3rem; margin: 0 0 1rem; position: relative; }
  p { color: #a9a4b2; font-size: 1.6rem; margin: .5rem 0; position: relative; }
  .pulse { width: 1.4rem; height: 1.4rem; border-radius: 50%; background: #fff; margin: 0 auto 2rem; animation: p 1.6s ease-out infinite; position: relative; }
  @keyframes p { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 100% { box-shadow: 0 0 0 2.4rem rgba(255,255,255,0); } }
</style>
</head>
<body>
<div class="rain"></div>
<div>
  <div class="pulse"></div>
  <h1>Waiting for Rain World…</h1>
  <p id="where"></p>
  <p>The dashboard appears as soon as the game is running with RainDash enabled.</p>
  <p>Press ☰ (menu) to change the PC address.</p>
</div>
<script>
  const u = new URLSearchParams(location.search).get('url');
  document.getElementById('where').textContent = u ? 'Trying ' + u : '';
</script>
</body>
</html>
